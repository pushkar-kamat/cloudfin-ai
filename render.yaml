services:
  - type: web
    name: cloudfin-ai-api
    runtime: python
    plan: free
    rootDir: backend

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

      # LLM routing
      - key: LLM_PRIMARY
        value: groq

      - key: LLM_FALLBACK
        value: gemini

      - key: LLM_FAILURE_THRESHOLD
        value: "1"

      - key: LLM_CIRCUIT_BREAKER_SECONDS
        value: "180"

      # Groq - primary
      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: openai/gpt-oss-20b

      - key: GROQ_TIMEOUT_SECONDS
        value: "15"

      # Gemini - optional fallback
      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        sync: false

      - key: GEMINI_TIMEOUT_SECONDS
        value: "8"

      # Supabase
      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false

      # Application
      - key: ADMIN_EMAILS
        sync: false

      - key: FRONTEND_URL
        sync: false