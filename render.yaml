services:
  - type: web
    name: cloudfin-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FRONTEND_URL
        sync: false
      - key: COGNITO_ISSUER
        sync: false
      - key: COGNITO_CLIENT_ID
        sync: false

  - type: static_site
    name: cloudfin-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_COGNITO_ISSUER
        sync: false
      - key: VITE_COGNITO_CLIENT_ID
        sync: false
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
